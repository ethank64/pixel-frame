name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "apps/infrastructure/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      TF_WORKING_DIR: apps/infrastructure/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Ensure static IP exists and is attached
        run: bash apps/infrastructure/scripts/ensure-static-ip.sh

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Import existing Lightsail resources if needed
        run: bash apps/infrastructure/scripts/import-existing.sh

      - name: Terraform Apply
        id: terraform
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply -auto-approve
          echo "ecr_url=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "public_ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REPOSITORY_URL: ${{ steps.terraform.outputs.ecr_url }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "${ECR_REPOSITORY_URL}:${IMAGE_TAG}" apps/backend
          docker tag "${ECR_REPOSITORY_URL}:${IMAGE_TAG}" "${ECR_REPOSITORY_URL}:latest"
          docker push "${ECR_REPOSITORY_URL}:${IMAGE_TAG}"
          docker push "${ECR_REPOSITORY_URL}:latest"

      - name: Deploy to Lightsail
        env:
          ECR_REPOSITORY_URL: ${{ steps.terraform.outputs.ecr_url }}
          IMAGE_TAG: ${{ github.sha }}
          PUBLIC_IP: ${{ steps.terraform.outputs.public_ip }}
        run: bash apps/infrastructure/scripts/deploy.sh

      - name: Verify public health endpoint
        env:
          PUBLIC_IP: ${{ steps.terraform.outputs.public_ip }}
        run: |
          curl -sf "http://${PUBLIC_IP}:8000/"
          echo ""
          echo "Backend live at http://${PUBLIC_IP}:8000/"
