name: pixel-frame-dev

services:
  backend:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /app
    volumes:
      - ./apps/backend:/app
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    command: >
      sh -c "uv sync &&
             uv run uvicorn main:app --reload --host 0.0.0.0 --port 8000"

  frontend:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_BACKEND_TARGET: http://backend:8000
    command: >
      sh -c "if [ ! -d node_modules/vite ]; then npm ci --ignore-scripts; fi &&
             npm run dev -w frontend -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend

volumes:
  frontend_node_modules:
